[versions]
agp = "9.4.1"
kotlin = "2.4.20"
coui = "1.1.0"
cmpose = "1.12.0"
materialIcons = "1.7.8"
androidx-lifecycle = "2.11.0"
activityCompose = "1.13.0"
appcompat = "1.7.1"
material = "1.13.0"

[libraries]
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
# COUI (ColorOS 17 / COUI 设计语言, Compose Multiplatform)
coui-ui = { group = "io.github.suqi8.coui.kmp", name = "coui-ui", version.ref = "coui" }
coui-core = { group = "io.github.suqi8.coui.kmp", name = "coui-core", version.ref = "coui" }
coui-squircle = { group = "io.github.suqi8.coui.kmp", name = "coui-squircle", version.ref = "coui" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "cmpose" }
material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIcons" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
